<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ambush! Digital — Mission 1: Bloody St. Mick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#4B5320; --paper:#EDE6D4; --ink:#22221E;
    --alert:#8E2A22; --amber:#C9A227; --bg:#1C1D1B; --panel-bg:#26271F; --panel-border:#4a4b3f;
    --clear:#8fce6a; --text-body:#d9dbc9; --text-label:#8c8e80;
    --font-head:'Staatliches','Arial Narrow',sans-serif;
    --font-ui:'Inter',-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--paper); font-family:var(--font-ui); overflow:hidden;}
  #app{display:flex; flex-direction:column; height:100vh;}

  #topbar{display:flex; align-items:center; gap:24px; padding:0 18px; height:48px; flex-shrink:0;
    background:#1f2019; border-bottom:1px solid var(--panel-border);}
  #topbar .logo{font-family:var(--font-head); font-size:20px; letter-spacing:1px; color:var(--amber);}
  #topbar .logo span{color:var(--paper); font-weight:400;}
  /* The build the player chose, carried in the title so a screenshot is never ambiguous. */
  #topbar .logo b{display:block; margin-top:-4px; font-family:var(--font-mono); font-size:10px; font-weight:400;
    letter-spacing:.9px; color:var(--text-label); text-transform:uppercase;}
  #topbar .field{font-family:var(--font-mono); font-size:12.5px; color:#c7c9b8;}
  #topbar .field b{color:var(--paper); font-weight:600;}
  #topbar .spacer{flex:1;}
  #topbar .note{font-family:var(--font-mono); font-size:10.5px; color:#7a7c6e;}

  #main{flex:1; display:flex; min-height:0;}

  #map-viewport{flex:1; position:relative; overflow-y:auto; overflow-x:hidden;
    background:#111209; padding:20px 0 10% 0; min-width:0;}
  #map-canvas{position:relative; width:100%; aspect-ratio:5336/4850;}
  #map-canvas img.map-image{width:100%; height:100%; display:block; object-fit:fill; user-select:none; -webkit-user-drag:none;
    filter:brightness(.68) saturate(.85);}

  .counter{position:absolute; width:3.9%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    cursor:pointer; filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); transition:left .35s ease, top .35s ease; z-index:2;}
  .counter img{width:100%; height:100%; display:block; object-fit:contain; pointer-events:none; -webkit-user-drag:none;}
  .counter.selected{outline:3px solid var(--amber); outline-offset:2px; border-radius:50%;}
  .counter.enemy{cursor:default;}
  .counter.active-actor{outline:3px solid #fff; outline-offset:2px; border-radius:50%; animation:pulse 1.1s ease-in-out infinite;}
  .counter.wounded{filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)) sepia(.5) saturate(3) hue-rotate(-30deg);}
  .counter.dead{opacity:.3; filter:grayscale(1);}
  .counter.hidden-german{display:none;}
  @keyframes pulse{0%,100%{outline-color:#fff;} 50%{outline-color:var(--amber);}}

  .entry-hex{position:absolute; width:3.4%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    border-radius:50%; background:rgba(201,162,39,.35); border:2px dashed var(--amber); cursor:pointer; z-index:3;}
  .entry-hex:hover{background:rgba(201,162,39,.6);}

  .dest-mark{position:absolute; width:2.1%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-family:var(--font-mono); font-weight:700; font-size:11px; color:#22221a; z-index:3;
    box-shadow:0 0 0 2px rgba(0,0,0,.6); opacity:.92; background:#8fce6a;}
  .dest-mark:hover{outline:2px solid #fff; opacity:1;}
  /* cost-* modifiers kept for a future Rounds-movement (§6/7) feature, where MP cost is real */
  .dest-mark.cost-1{background:#8fce6a;}
  .dest-mark.cost-2{background:var(--amber);}
  .dest-mark.cost-3plus{background:#d97a3a;}

  .path-mark{position:absolute; width:0.9%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    border-radius:50%; background:#fff; opacity:.85; z-index:1; pointer-events:none;}

  .event-marker{position:absolute; width:2.6%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    border-radius:2px; background:rgba(142,42,34,.5); border:2px solid var(--alert); z-index:1;
    pointer-events:none;}
  .event-marker::after{content:"!"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-family:var(--font-head); font-size:12px; color:#f0d9d5;}

  #hud{width:340px; flex-shrink:0; background:var(--panel-bg); border-left:1px solid var(--panel-border);
    display:flex; flex-direction:column; padding:12px; gap:12px; overflow-y:auto;}
  #hud h3{font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:1.4px; color:var(--text-label); margin:0 0 6px;}
  .sec{border-top:1px solid #34362b; padding-top:10px;}
  .sec:first-child{border-top:none; padding-top:0;}

  .mini-card{background:#1f2019; border:1px solid var(--panel-border); border-radius:3px; padding:9px; font-size:12.5px;}
  .mini-card .row{display:flex; align-items:center; gap:9px;}
  .mini-card img{width:38px; height:38px;}
  .mini-card .name{font-family:var(--font-head); font-size:17px; color:var(--amber); letter-spacing:.5px;}
  .mini-card .stats{font-family:var(--font-mono); font-size:11px; color:var(--text-body); margin-top:5px; line-height:1.6;}
  .mp-readout{font-family:var(--font-mono); font-size:12.5px; color:var(--text-body); margin-top:6px;}
  .mp-readout b{color:var(--amber); font-size:15px;}

  .vp-readout{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:13px; color:var(--text-body); padding:3px 0;}
  .vp-readout b{color:var(--amber); font-size:16px;}

  .roster-slot{display:flex; align-items:center; gap:8px; padding:4px 0; font-family:var(--font-mono); font-size:11px; color:var(--text-body);}
  .roster-slot img{width:26px; height:26px;}
  .roster-slot.dead{opacity:.4;}
  .roster-slot .letter{color:var(--amber); font-weight:700; width:14px;}

  .stance-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px;}
  .btn{font-family:var(--font-ui); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--paper); background:linear-gradient(180deg,#5a5d3e,#454724); border:1px solid #6d7048; border-radius:3px;
    padding:8px 6px; cursor:pointer; text-align:center;}
  .btn:hover{background:linear-gradient(180deg,#666a46,#50522a); border-color:var(--amber);}
  .btn.active{background:linear-gradient(180deg,var(--amber),#a5811d); color:#22221a; border-color:#e0bb3d;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn.wide{width:100%; margin-top:8px;}
  .btn.amber{background:linear-gradient(180deg,var(--amber),#a5811d); color:#22221a; border-color:#e0bb3d;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;}
  .action-grid .btn.wide2{grid-column:1 / -1;}

  .ar-track{display:flex; flex-direction:column; gap:5px;}
  .ar-slot{background:#1f2019; border:1px solid var(--panel-border); border-radius:3px; padding:6px 8px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-body); display:flex; justify-content:space-between; gap:6px;}
  .ar-slot.current{border-color:var(--amber); background:rgba(201,162,39,.1); color:var(--paper);}
  .ar-slot .label{color:var(--text-label); text-transform:uppercase; font-size:9.5px; letter-spacing:.8px;}
  .ar-slot .occ{color:var(--text-body);}
  .ar-slot .occ .g{color:#c98a83;}

  .log-line{font-family:var(--font-mono); font-size:10.5px; padding:3px 0; border-bottom:1px dashed #3a3b32; color:var(--text-body); line-height:1.5;}
  .log-line b{color:var(--paper);}
  .log-line .roll{color:var(--amber); font-weight:700;}
  .log-line.hit{color:#e8b9b3;}
  .log-line.event{color:var(--amber); font-weight:600;}
  #combatlog{max-height:100%; overflow-y:auto; flex:1;}

  #status-banner{font-family:var(--font-head); font-size:14px; letter-spacing:.5px; text-align:center;
    padding:7px 0; border-radius:3px; background:#1f2019; border:1px solid var(--panel-border); color:var(--amber);}
  #status-banner.win{color:var(--clear); border-color:#4c7a35; background:rgba(143,206,106,.1);}
  #status-banner.lose{color:#e8b9b3; border-color:#6d1f18; background:rgba(142,42,34,.12);}

  /* ---- popups ---- */
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:20;}
  .backdrop.open{display:flex;}
  .popup{background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:3px; width:640px; max-width:92vw;
    max-height:88vh; display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(0,0,0,.6); outline:none;}
  .popup.narrow{width:460px;}
  .popup.wide{width:820px;}
  .popup .popup-head{display:flex; align-items:center; gap:10px; padding:11px 18px;
    background:#1f2019; border-bottom:1px solid var(--panel-border); font-family:var(--font-ui); font-weight:600;
    font-size:12.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--amber);}
  .dialog-badge{font-family:var(--font-mono); font-size:10px; letter-spacing:.5px; text-transform:none; color:#e0bb3d;
    background:rgba(201,162,39,.15); border:1px solid #6d5f2a; border-radius:10px; padding:2px 8px;}
  .popup .popup-body{padding:18px; overflow-y:auto; font-size:13.5px; color:#d8d9cc; flex:1;}
  .popup .popup-foot{display:flex; justify-content:flex-end; gap:10px; padding:14px 18px; border-top:1px solid var(--panel-border);}

  .combat-row{display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:6px;}
  .combatant{background:#1f2019; border:1px solid var(--panel-border); border-radius:4px; padding:12px; width:180px; text-align:center;}
  .combatant img{width:56px; height:56px; margin-bottom:6px;}
  .combatant .cname{font-family:var(--font-head); font-size:16px; color:var(--amber);}
  .combatant .cstat{font-family:var(--font-mono); font-size:11px; color:#c7c9b8; margin-top:4px;}
  .vs{font-family:var(--font-head); font-size:22px; color:#6d7048;}
  .dice-tray{display:flex; align-items:center; gap:16px; justify-content:center; margin:16px 0; flex-wrap:wrap;}
  .die-face{width:56px; height:56px; background:var(--paper); color:var(--ink); border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:28px;
    box-shadow:0 2px 4px rgba(0,0,0,.5); transition:transform .15s;}
  .die-face.rolling{transform:rotate(8deg) scale(1.05);}
  .result-line{text-align:center; font-family:var(--font-mono); font-size:13px; color:var(--paper); margin-top:14px; min-height:20px;}
  .result-line b{color:var(--amber);}
  .step-context{text-align:center; font-family:var(--font-mono); font-size:12px; color:#c7c9b8; line-height:1.6;}
  .paragraph-body{font-size:15px; line-height:1.7; font-style:italic; color:var(--paper); text-align:left;}
  .save-list{max-height:360px; overflow-y:auto; display:flex; flex-direction:column;}
  .save-row{display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:11px 4px; border-bottom:1px solid var(--panel-border); cursor:pointer; text-align:left;}
  .save-row:last-child{border-bottom:none;}
  .save-row:hover{background:rgba(201,162,39,.1);}
  .save-ts{font-family:var(--font-mono); font-size:12.5px; color:var(--paper);}
  .save-desc{font-family:var(--font-mono); font-size:11px; color:var(--text-label); text-transform:uppercase; letter-spacing:.6px;}
  .gcard{display:grid; grid-template-columns:1fr 1fr; gap:2px 22px; margin-top:4px;}
  .gcard-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:6px 0; border-bottom:1px solid var(--panel-border); font-family:var(--font-mono); font-size:11.5px;}
  .gcard-row span{color:var(--text-label); text-transform:uppercase; font-size:9.5px; letter-spacing:.7px;}
  .gcard-row b{color:var(--paper); text-align:right;}
  .gcard-notes{margin-top:14px; padding:10px 12px; background:rgba(201,162,39,.08);
    border-left:2px solid var(--amber); font-size:12px; line-height:1.6; color:var(--text-body);}
  .gcard-notes span{display:block; color:var(--text-label); text-transform:uppercase;
    font-size:9.5px; letter-spacing:.7px; margin-bottom:4px; font-family:var(--font-mono);}
  .target-list{max-height:340px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; margin-top:14px;}
  .target-row{display:flex; align-items:center; gap:12px; padding:10px 6px; cursor:pointer;
    border:1px solid transparent; border-bottom:1px solid var(--panel-border); text-align:left;}
  .target-row:last-child{border-bottom:1px solid transparent;}
  .target-row:hover{background:rgba(201,162,39,.12); border-color:var(--amber);}
  .target-row img{width:34px; height:34px; object-fit:contain; flex:none;}
  .target-id{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0;}
  .target-id b{font-family:var(--font-mono); font-size:12.5px; color:var(--paper); font-weight:600;}
  .target-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--text-label);}
  .target-note{font-family:var(--font-mono); font-size:10.5px; color:var(--amber); opacity:.85;}
  .target-note b{color:var(--amber);}
  .target-why{font-family:var(--font-mono); font-size:10.5px; color:var(--text-body); opacity:.8; line-height:1.45;}
  .target-odds{display:flex; flex-direction:column; align-items:center; gap:1px; flex:none;
    font-family:var(--font-mono); font-size:20px; color:var(--amber); font-weight:700; line-height:1;}
  .target-odds{min-width:84px;}
  .target-odds span{white-space:nowrap; font-size:9px; color:var(--text-label); font-weight:400; text-transform:uppercase; letter-spacing:.7px;}

  /* ---- Soldier Inspector (stance exposure table) ---- */
  .stance-table{display:flex; gap:8px; margin-top:8px;}
  .stance-cell{flex:1; text-align:center; border:1px solid var(--panel-border); border-radius:3px;
    padding:6px 4px; font-family:var(--font-mono);}
  .stance-cell b{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--text-label); font-weight:600;}
  .stance-cell span{display:block; font-size:16px; color:var(--paper); margin-top:2px;}
  .stance-cell.current{border-color:var(--amber); background:rgba(201,162,39,.12);}
  .stance-cell.current b{color:var(--amber);}

  /* ---- Term tooltips (glossary hover, e.g. IN/PC/WS/MPA labels, hit-chance breakdown terms) ---- */
  .tt{border-bottom:1px dotted var(--text-label); cursor:help; position:relative;}
  .tt::after{content:attr(data-tip); position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); z-index:30;
    width:220px; max-width:60vw; background:#1f2019; border:1px solid var(--amber); border-radius:4px;
    padding:8px 10px; font-family:var(--font-mono); font-size:11px; line-height:1.5; color:var(--text-body);
    text-transform:none; letter-spacing:normal; box-shadow:0 4px 12px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .1s ease; white-space:normal;}
  .tt:hover::after, .tt:focus::after{opacity:1;}
  .target-odds.tt{border-bottom:none;}

  /* ---- floating, draggable, non-modal window (Objectives) ---- */
  .float-dialog{position:fixed; width:340px; display:none; background:var(--panel-bg);
    border:1px solid var(--panel-border); border-radius:4px; box-shadow:0 10px 40px rgba(0,0,0,.6); z-index:30;}
  .float-titlebar{display:flex; align-items:center; justify-content:space-between; padding:9px 12px;
    background:#1f2019; border-bottom:1px solid var(--panel-border); border-radius:4px 4px 0 0;
    cursor:move; user-select:none; font-family:var(--font-ui); font-weight:600; font-size:12px;
    text-transform:uppercase; letter-spacing:1.5px; color:var(--amber);}
  .float-titlebar button{background:none; border:none; color:#9a9c8f; font-size:16px; cursor:pointer;}
  .float-body{padding:16px; font-size:13.5px; color:var(--text-body); line-height:1.6;}
  .float-body h4{margin:0 0 4px; font-family:var(--font-head); font-size:13px; letter-spacing:.5px; color:var(--amber);}
  .float-body p{margin:0 0 12px;}
  .float-body .obj-vp{font-family:var(--font-mono); font-size:15px; color:var(--paper);}

  #topbar .btn.small{padding:5px 10px; font-size:10.5px; margin:0;}

  .toast-stack{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:40; width:320px;}
  .toast{background:#2c1a17; border:1px solid var(--alert); color:#f0d9d5; font-family:var(--font-mono);
    font-size:12.5px; padding:10px 14px; border-radius:4px; box-shadow:0 4px 16px rgba(0,0,0,.5); cursor:pointer;
    opacity:1; transition:opacity .2s, transform .2s;}
  .toast.toast-out{opacity:0; transform:translateX(20px);}
  /* v2 task 3 — resolution cards (docs/01_PRESENTATION_SPEC.md §3) */
  #speedCtl{display:flex; gap:0;}
  #speedCtl .btn{border-radius:0; margin-left:-1px;}
  #speedCtl .btn:first-child{border-radius:3px 0 0 3px;}
  #speedCtl .btn:last-child{border-radius:0 3px 3px 0;}
  .res-card{position:absolute; z-index:6; width:300px; background:rgba(38,39,31,.96); border:1px solid var(--panel-border);
    border-left:3px solid var(--amber); border-radius:3px; box-shadow:0 6px 22px rgba(0,0,0,.6); pointer-events:none;
    transition:opacity .35s;}
  .res-card.fading{opacity:0;}
  .res-foot{display:none; padding:2px 10px 8px; text-align:right;}
  .res-card.done{pointer-events:auto; cursor:pointer; border-left-color:var(--clear);}
  .res-card.done .res-foot{display:block;}
  .res-card.done .res-done{padding:4px 18px; font-size:12px;}
  .res-card.held{border-left-color:var(--paper);}
  .res-card.held .res-head::after{content:'paused'; float:right; font-family:var(--font-mono); font-size:10px;
    letter-spacing:.8px; text-transform:uppercase; color:var(--text-label); padding-top:3px;}
  .res-head{font-family:var(--font-head); font-size:15px; letter-spacing:.6px; color:var(--amber); padding:6px 10px 4px;
    border-bottom:1px solid var(--panel-border);}
  .res-lines{padding:4px 10px 6px;}
  .res-line{padding:5px 0; border-bottom:1px dashed #3a3b32; animation:resIn .18s ease-out;}
  .res-line:last-child{border-bottom:none;}
  @keyframes resIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .res-title{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-label);}
  .res-text,.res-context,.res-result{font-size:12px; color:var(--text-body); line-height:1.45;}
  .res-context{margin-top:2px;}
  .res-paragraph{font-family:var(--font-mono); font-size:11px; color:var(--paper); background:#1f2019; padding:6px; margin-top:3px;
    max-height:9.5em; overflow:hidden; -webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);} /* full text: the log */
  .res-roll{display:flex; align-items:center; gap:6px; margin-top:4px;}
  .res-die{flex:0 0 26px; height:26px; background:var(--paper); color:var(--ink); border-radius:4px; display:flex;
    align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:15px;}
  .res-die.rolling{transform:rotate(8deg);}
  .res-result{flex:1;}
  body.resolving #map-canvas, body.resolving #hud{pointer-events:none;}
  body.resolving #combatlog{pointer-events:auto;} /* the radio log stays readable mid-resolution */
  /* The radio log is a primary surface in cards mode: it keeps real height and the panel scrolls
     instead (in v1 the Action Round buttons squeezed it to nothing). */
  body.cards-mode #log-sec{min-height:230px !important; flex:1 0 230px !important;}

  /* v2 task 4 — board effects (cards mode only) */
  #fx-layer{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; overflow:visible;}
  .fx-tracer{stroke:var(--amber); stroke-width:2.5; vector-effect:non-scaling-stroke; stroke-dasharray:7 5;
    stroke-linecap:round; animation:fxMarch .5s linear infinite; transition:opacity .45s, stroke .2s;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.9));}
  .fx-tracer.fx-grenade{stroke:#e0bb3d; stroke-dasharray:2 6;}
  .fx-tracer.fx-assault{stroke:#e8e2cf; stroke-width:3.5; stroke-dasharray:none;}
  .fx-tracer.fx-hit{stroke:#e05a4a; stroke-width:3.5; stroke-dasharray:none; animation:none;}
  .fx-tracer.fx-miss, .fx-tracer.fx-stale{stroke:#8c8e80; animation:none; opacity:.7;}
  .fx-tracer.fx-jam{stroke:#8c8e80; stroke-dasharray:2 10; animation:none;}
  @keyframes fxMarch{to{stroke-dashoffset:-12;}}
  .fx-trail{stroke:var(--paper); stroke-width:2; vector-effect:non-scaling-stroke; stroke-dasharray:1 5; stroke-linecap:round;
    opacity:.75; transition:opacity .45s;}
  .fx-gone{opacity:0 !important;}
  .fx-die{position:absolute; z-index:7; transform:translate(-50%,-50%); width:26px; height:26px; border-radius:4px;
    background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.7); pointer-events:none;
    animation:fxRise 1.5s ease-out forwards;}
  .fx-die.fx-hit, .fx-die.fx-bad{background:#e05a4a; color:#fff;}
  .fx-die.fx-miss{background:#8c8e80; color:#22221a;}
  @keyframes fxRise{0%{opacity:0; margin-top:6px;} 15%{opacity:1; margin-top:0;} 75%{opacity:1;} 100%{opacity:0; margin-top:-26px;}}
  .fx-badge{position:absolute; z-index:7; transform:translate(-50%,-100%); padding:2px 7px; border-radius:2px; white-space:nowrap;
    font-family:var(--font-head); font-size:13px; letter-spacing:.8px; pointer-events:none; box-shadow:0 2px 6px rgba(0,0,0,.7);
    background:var(--paper); color:var(--ink); animation:fxPop .22s ease-out; transition:opacity .45s;}
  .fx-badge.fx-bad{background:#8E2A22; color:#fff;}
  .fx-badge.fx-amber{background:var(--amber); color:#22221a;}
  .fx-badge.fx-neutral{background:#3a3b32; color:var(--paper); border:1px solid #5a5b4f;}
  @keyframes fxPop{from{transform:translate(-50%,-100%) scale(.6); opacity:0;} to{transform:translate(-50%,-100%) scale(1); opacity:1;}}
  .fx-blast{position:absolute; z-index:6; width:6%; aspect-ratio:1/1; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle,#fff3c4 0%,#e0bb3d 35%,rgba(224,90,74,.6) 60%,transparent 72%); pointer-events:none;
    animation:fxBlast .8s ease-out forwards;}
  .fx-blast.fx-dud{background:radial-gradient(circle,rgba(200,200,190,.5) 0%,transparent 65%);}
  @keyframes fxBlast{0%{opacity:0; transform:translate(-50%,-50%) scale(.3);} 20%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.5);}}

  /* Presentation chooser (two builds, side by side, one button each) */
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:4px;}
  .mode-col{display:flex; flex-direction:column; border:1px solid var(--panel-border); border-radius:3px;
    background:#1f2019; padding:12px 13px 13px;}
  .mode-col .ver{font-family:var(--font-mono); font-size:10.5px; letter-spacing:1px; color:var(--text-label);}
  .mode-col h4{font-family:var(--font-head); font-size:19px; letter-spacing:.6px; color:var(--amber); margin:2px 0 6px;}
  .mode-col .tag{font-size:12px; color:var(--paper); margin-bottom:8px;}
  .mode-col ul{margin:0 0 12px; padding-left:17px; font-size:11.5px; line-height:1.65; color:var(--text-body);}
  .mode-col .btn{margin-top:auto; width:100%;}
  .mode-col.current{border-color:var(--amber);}
  .mode-col.current .ver::after{content:' · last played'; color:var(--amber);}

  /* v2 task 5 — the map as an information surface (cards mode only) */
  #info-layer{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;}
  #info-layer .reach{stroke:rgba(237,230,212,.35); stroke-width:4;}
  #info-layer .reach.cov-open{fill:rgba(224,90,74,.20);}
  #info-layer .reach.cov-light{fill:rgba(201,162,39,.22);}
  #info-layer .reach.cov-good{fill:rgba(143,206,106,.26);}
  #info-layer .route{fill:none; stroke:var(--amber); stroke-width:10; stroke-linejoin:round; stroke-linecap:round;
    stroke-dasharray:22 16; opacity:.85;}
  #info-layer .route-end{fill:rgba(201,162,39,.45); stroke:var(--amber); stroke-width:6;}
  #info-layer .edge{stroke-linecap:round;}
  #info-layer .edge-wall{stroke:#1a1a14; stroke-width:16;}
  #info-layer .edge-aperture_window{stroke:#7fb7d9; stroke-width:12; stroke-dasharray:18 12;}
  #info-layer .edge-aperture_door{stroke:#e0bb3d; stroke-width:14;}
  #info-layer .edge-crest, #info-layer .edge-embankment{stroke:#8a6a3a; stroke-width:10; stroke-dasharray:6 10;}
  #info-tip{position:fixed; z-index:50; display:none; max-width:300px; pointer-events:none; padding:8px 10px;
    background:rgba(31,32,25,.97); border:1px solid var(--panel-border); border-left:3px solid var(--amber); border-radius:3px;
    box-shadow:0 6px 18px rgba(0,0,0,.6); font-size:11.5px; line-height:1.5; color:var(--text-body);}
  #info-tip b{color:var(--paper);}
  #info-tip hr{border:none; border-top:1px dashed #4a4b3f; margin:6px 0;}
  #info-tip .ih-head{font-family:var(--font-mono); font-size:11px; color:var(--paper); margin-bottom:3px;}
  #info-tip .ih-cov{font-size:9.5px; text-transform:uppercase; letter-spacing:.7px; padding:0 4px; border-radius:2px; margin-left:4px;}
  #info-tip .ih-cov.cov-open{background:rgba(224,90,74,.35);}
  #info-tip .ih-cov.cov-light{background:rgba(201,162,39,.35);}
  #info-tip .ih-cov.cov-good{background:rgba(143,206,106,.35);}
  #info-tip .ih-dim{color:var(--text-label);}
  #info-tip .ih-warn{color:#e8b9b3;}
  #info-tip .ih-close{font-size:10px; margin-top:5px; border-top:1px dashed #4a4b3f; padding-top:4px;}
  #info-tip .ih-reason{color:var(--amber); font-size:10.5px; margin-top:3px;}

  /* v2 task 4 — radio log */
  .log-line.radio details summary{cursor:pointer; list-style:none;}
  .log-line.radio details summary::-webkit-details-marker{display:none;}
  .log-line.radio .why{font-size:9.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--amber);
    border:1px solid #5a5b4f; border-radius:2px; padding:0 4px; margin-left:4px;}
  .log-line.radio details[open] .why{background:var(--amber); color:#22221a;}
  .radio-detail{margin:5px 0 3px; padding:6px 8px; background:#1f2019; border-left:2px solid var(--amber); color:var(--paper); font-size:10.5px;}
  .log-line.radio.para{border-left:2px solid var(--amber); padding-left:6px; margin:2px 0;}
  .log-line.radio.para summary{color:var(--amber); font-weight:600;}
  .radio-clip{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; color:var(--paper);
    font-weight:400; margin-top:2px;}
  .log-line.radio.para details[open] .radio-clip{display:none;}
  body.resolving #map-viewport{cursor:progress;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="logo">AMBUSH! <span>Digital</span><b id="build-label"></b></div>
    <div class="field">MISSION 1 — BLOODY ST. MICK</div>
    <div class="field">PHASE: <b id="tb-phase">Squad Generation</b></div>
    <div class="field">MODE: <b id="tb-difficulty">Normal</b></div>
    <button class="btn small" id="objectivesBtn">Objectives</button>
    <button class="btn small" id="voiceBtn" title="Voice-over is off">&#128263; Voice</button>
    <div id="speedCtl" title="Resolution speed. Hold Space, or hold the mouse on the map, to run to the next decision.">
      <button class="btn small" data-speed="slow">Slow</button><button class="btn small" data-speed="normal">Normal</button><button class="btn small" data-speed="fast">Fast</button>
    </div>
    <div class="spacer"></div>
  </div>

  <div id="main">
    <div id="map-viewport">
      <div id="map-canvas">
        <img class="map-image" src="../../assets/library/map/map_a_tactical.png" alt="Map A" draggable="false">
      </div>
    </div>

    <div id="hud">
      <div class="sec">
        <div id="status-banner">Generating your squad...</div>
      </div>

      <div class="sec">
        <h3>Victory Points</h3>
        <div class="vp-readout"><span>Gained</span><b id="vp-gained">0</b></div>
        <div class="vp-readout"><span>Lost</span><b id="vp-lost">0</b></div>
        <div class="vp-readout"><span>Total (need <span id="vp-need">13</span>)</span><b id="vp-total">0</b></div>
      </div>

      <div class="sec" id="roster-sec">
        <h3>Squad</h3>
        <div id="roster-list"></div>
      </div>

      <div class="sec" id="movement-sec" style="display:none;">
        <h3>Selected Soldier</h3>
        <div class="mini-card">
          <div class="row">
            <img id="mc-img" src="">
            <div class="name" id="mc-name">—</div>
          </div>
          <div class="stats" id="mc-stats"></div>
          <div class="mp-readout" id="mc-mp"></div>
        </div>
        <div class="stance-grid">
          <button class="btn" id="stance-standing">Stand</button>
          <button class="btn" id="stance-crouching">Crouch</button>
          <button class="btn" id="stance-prone">Prone</button>
        </div>
        <div id="groupMoveRow" style="display:none; margin-top:6px; font-size:12px; color:var(--text-label);">
          <label><input type="checkbox" id="groupMoveToggle"> Move as group (<span id="groupMoveCount">0</span> soldiers here, same stance — one Paragraph Check, &sect;5/3)</label>
        </div>
        <div id="bringPrisonerRow" style="display:none; margin-top:6px; font-size:12px; color:var(--text-label);">
          <label><input type="checkbox" id="bringPrisonerToggle"> Bring captured German along (&sect;11/2) &mdash; otherwise leaving him behind frees him</label>
        </div>
        <button class="btn wide" id="exitMapBtn" style="margin-top:6px;">Exit map (A1–J1)</button>
        <button class="btn wide" id="clearJamOpsBtn" style="margin-top:6px;">Clear Jammed Weapon</button>
      </div>

      <div class="sec" id="action-sec" style="display:none;">
        <h3>Current Actor</h3>
        <div class="mini-card">
          <div class="row">
            <img id="act-img" src="">
            <div class="name" id="act-name">—</div>
          </div>
          <div class="stats" id="act-stats"></div>
        </div>
        <div class="action-grid">
          <button class="btn" id="moveBtn">Move</button>
          <button class="btn" id="fireAimed">Fire — Aimed</button>
          <button class="btn" id="fireSnap">Fire — Snap</button>
          <button class="btn" id="assaultBtn">Assault</button>
          <button class="btn" id="grenadeBtn">Throw Grenade</button>
          <button class="btn" id="dragBtn">Drag Inactive Soldier</button>
          <button class="btn" id="giveTurnBtn">Give Turn</button>
          <button class="btn" id="makeAwareBtn">Make Aware</button>
          <button class="btn" id="changeStanceBtn">Change Stance</button>
          <button class="btn" id="prepareWeaponBtn">Prepare Weapon</button>
          <button class="btn wide2" id="pickupBtn">Pick Up / Exchange Equipment</button>
          <button class="btn wide2" id="clearJamBtn">Clear Jammed Weapon</button>
          <button class="btn wide2" id="passTurn">Pass</button>
        </div>
        <button class="btn wide" id="cancelMoveBtn" style="display:none;">Cancel move</button>
      </div>

      <div class="sec" id="track-sec" style="display:none;">
        <h3>Action Round Track</h3>
        <div class="ar-track" id="ar-track"></div>
      </div>

      <div class="sec" id="round-sec" style="display:none;">
        <button class="btn wide amber" id="newRoundBtn">Start Next Round</button>
      </div>

      <div class="sec" id="log-sec" style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <h3 id="log-heading">Log</h3>
        <div id="combatlog"></div>
      </div>

      <div class="sec">
        <div class="action-grid">
          <button class="btn" id="saveGameBtn">Save</button>
          <button class="btn" id="loadGameBtn">Load</button>
          <button class="btn" id="exportSaveBtn">Export save</button>
          <button class="btn" id="importSaveBtn">Import save</button>
        </div>
        <input type="file" id="importSaveFile" accept="application/json" style="display:none;">
        <button class="btn wide" id="presentationBtn" style="margin-top:6px;">Presentation…</button>
        <button class="btn wide" id="downloadLogBtn" style="margin-top:6px;">Download log</button>
        <button class="btn wide" id="resetBtn" style="margin-top:6px;">Restart mission</button>
      </div>
    </div>
  </div>

</div>

<div id="dialogs-root"></div>

<script src="hexgrid.js"></script>
<script src="movementrules.js"></script>
<script src="losrules.js"></script>
<script src="checksrules.js"></script>

<script src="arscheduler.js"></script>
<script src="firecombat.js"></script>
<!-- grenaderules.js captures window.AMBUSH_GRENADE_SCATTER at load time (its own top-level `var
     SCATTER = ...`, not read lazily inside a function like every other rules module's data
     dependency), so the data file must load first. Found live while wiring Task #63 — grenade
     combat was the first thing that ever actually called Gr.resolveScatter() in the browser
     (docs/35_GRENADE_COMBAT.md); the tools/test_grenades.js require() order was always correct,
     which is why this went unnoticed until now. -->
<script src="../../assets/data/grenade_scatter.js"></script>
<script src="grenaderules.js"></script>
<script src="assaultrules.js"></script>
<script src="crewweaponrules.js"></script>
<script src="hazardrules.js"></script>
<script src="penetrationrules.js"></script>
<script src="equipmentrules.js"></script>
<script src="squadgenrules.js"></script>
<script src="victoryrules.js"></script>
<script src="difficulty.js"></script>
<script src="germanactions.js"></script>
<script src="paragraphinterpreter.js"></script>
<script src="operationsloop.js"></script>
<script src="ambushdialogs.js"></script>
<script src="../../assets/data/terrain_map_a.js"></script>
<script src="../../assets/data/los_map_a.js"></script>
<script src="../../assets/data/ar_track.js"></script>
<script src="../../assets/data/weapon_chart.js"></script>
<script src="../../assets/data/squad_generation.js"></script>
<script src="../../assets/data/german_roster.js"></script>
<script src="../../assets/data/missions.js"></script>
<script src="../../assets/data/paragraphs.js"></script>
<script src="../../assets/data/mission_cards.js"></script>
<script src="../../assets/data/mission_cards_movement.js"></script>
<script src="../../assets/data/paragraph_programs.js"></script>
<script src="../../assets/data/german_action_programs.js"></script>
<script src="mission1demo.js"></script>
</body>
